<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Swordfish silhouette pointing right. -->
  <!-- The bill is a long needle on the right; tail forks on the left. -->
  <g fill="#4cc4ff">
    <!-- Body + bill + forked tail as one outline. -->
    <path d="M 60 32
             L 38 28
             C 32 26 24 26 18 28
             L 8 25
             L 2 20
             L 8 32
             L 2 44
             L 8 39
             L 18 36
             C 24 38 32 38 38 36
             Z" />
    <!-- Dorsal fin (top). -->
    <path d="M 28 28 L 33 13 L 38 28 Z" />
    <!-- Pectoral fin (bottom). -->
    <path d="M 32 38 L 26 47 L 36 41 Z" />
  </g>
</svg>
